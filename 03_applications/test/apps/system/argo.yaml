spec:
  name: argocd
  autoSync: false
  sources:
    - repoURL: 'https://github.com/antoooks/hello-azure-v2'
      targetRevision: main
      ref: values
    # [ARGOCD-OIDC] Must match argoAuth in argo-bootstrap.yaml.gotmpl (helmfile fails if not):
    #   admin: keep this source commented out and use argo-auth-admin.yaml in the argo-cd valueFiles below
    #   oidc:  uncomment this source and use argo-auth-oidc.yaml instead
    # - chart: sscsid-keeper
    #   repoURL: ghcr.io/unique-ag/helm-charts
    #   targetRevision: 1.3.0
    #   helm:
    #     releaseName: argo-azure-entra-secret
    #     valueFiles:
    #       - $values/03_applications/test/values/argo/argo-azure-entra-secret.yaml
    - chart: argo-cd
      repoURL: https://argoproj.github.io/argo-helm
      targetRevision: 9.3.5
      helm:
        releaseName: argo
        valueFiles:
          - $values/03_applications/test/values/argo/argo.yaml
          - $values/03_applications/test/values/argo/argo-auth-admin.yaml # [ARGOCD-OIDC] or argo-auth-oidc.yaml
          - $values/03_applications/test/values/argo/argo-repository-secrets.yaml
    - chart: argocd-apps
      repoURL: https://argoproj.github.io/argo-helm
      targetRevision: 2.0.2
      disableValidationOnInstall: true
      helm:
        releaseName: argo-appsets
        valueFiles:
          - $values/03_applications/test/values/argo/argo-appsets.yaml
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
