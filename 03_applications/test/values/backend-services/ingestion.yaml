image:
  tag: "2026.44.3"
  repository: uqhacranto.azurecr.io/backend-service-ingestion
env:
  ELASTICSEARCH_CA_BUNDLE: /etc/ssl/elastic/ca.crt
  ELASTICSEARCH_URL: https://elasticsearch-ingestion-es-http.unique.svc:9200
  ELASTICSEARCH_USERNAME: elastic
  INGESTION_UPLOAD_API_URL: https://api.sb-trilaksono-001.unique.dev/scoped/ingestion/upload
  ZITADEL_ROOT_ORG_ID: "361772156100608158"
envVars:
  - name: RABBITMQ_USERNAME
    valueFrom:
      secretKeyRef:
        name: rabbitmqcluster-chat-default-user
        key: username
  - name: AMQP_USERNAME
    valueFrom:
      secretKeyRef:
        name: rabbitmqcluster-chat-default-user
        key: username
  - name: RABBITMQ_PASSWORD
    valueFrom:
      secretKeyRef:
        name: rabbitmqcluster-chat-default-user
        key: password
  - name: AMQP_PASSWORD
    valueFrom:
      secretKeyRef:
        name: rabbitmqcluster-chat-default-user
        key: password
  - name: AMQP_HOST
    valueFrom:
      secretKeyRef:
        name: rabbitmqcluster-chat-default-user
        key: host
  - name: AMQP_PORT
    valueFrom:
      secretKeyRef:
        name: rabbitmqcluster-chat-default-user
        key: port
  - name: ELASTICSEARCH_PASSWORD
    valueFrom:
      secretKeyRef:
        name: elasticsearch-ingestion-es-elastic-user
        key: elastic
replicaCount: 2
resources:
  limits:
    cpu: 200m
    memory: 700Mi
  requests:
    cpu: 200m
    memory: 650Mi
serviceAccount:
  enabled: true
  workloadIdentity:
    clientId: dab5987e-78fe-48a8-986c-9e8c09f2321a # aks-id-anto
    enabled: true
secretProvider:
  vaults:
    hakv2anto:
      DATABASE_URL: database-url-ingestion
      AZURE_FGPT_STORAGE_CONNECTION_STRING: ingestion-storage-connection-string-1
      AZURE_INGESTION_CACHE_STORAGE_CONNECTION_STRING: ingestion-cache-connection-string-1
      INGESTION_ENCRYPTION_KEY: encryption-key-ingestion
    hakv1anto:
      AZURE_OPENAI_API_ENDPOINT: cognitive-account-swedencentral-ep
      AZURE_DOCUMENT_INTELLIGENCE_ENDPOINTS: azure-document-intelligence-endpoints
volumeMounts:
  - name: elastic-certs
    mountPath: /etc/ssl/elastic/ca.crt
    readOnly: true
    subPath: ca.crt
volumes:
  - name: elastic-certs
    secret:
      secretName: elasticsearch-ingestion-es-http-certs-public
