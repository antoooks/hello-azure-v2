# [ARGOCD-OIDC] Only used for Argo CD Entra ID (OIDC) login. Mounts the OIDC app's client ID/secret from Key Vault.
# Deployed only with argoAuth: oidc in argo-bootstrap.yaml.gotmpl (and the sscsid-keeper source in apps/system/argo.yaml).
# Before switching to oidc, set gitops_app_registration_enabled = true in day-2 and update kvName, tenantId,
# identityId and the kvObjectName values (aad-app-<custom_subdomain>-<env>-gitops-client-id/-secret) for this sandbox.
keeper:
  image:
    repository: uqhacranto.azurecr.io/busybox
    tag: "1.37"
spc:
  kvName: hakv2anto
  tenantId: aeade8c4-d4f7-4ae7-9149-4975fa3a7f91
  identityId: 1f10df87-9938-4fe9-87c4-b3170f6e9611 # azurekeyvaultsecretsprovider-aks-test (client ID)
  labels:
    app: argocd
    app.kubernetes.io/part-of: argocd
  secrets:
    - k8sSecretDataKey: oidc.azure.client_id
      kvObjectName: aad-app-ha-test-gitops-client-id
    - k8sSecretDataKey: oidc.azure.client_secret
      kvObjectName: aad-app-ha-test-gitops-client-secret