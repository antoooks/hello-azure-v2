nameOverride: argo
global:
  domain: argo.sb-trilaksono.unique.dev
  nodeSelector:
    scalability: steady
    lifecycle: persistent
repoServer:
  extraArgs:
    - --repo-cache-expiration=15m
server:
  ingress:
    enabled: true
    ingressClassName: azure-application-gateway
    annotations:
      appgw.ingress.kubernetes.io/ssl-redirect: "true"
      appgw.ingress.kubernetes.io/backend-protocol: "https"
      cert-manager.io/cluster-issuer: letsencrypt-azure-dns
    hosts:
      - argo.sb-trilaksono.unique.dev
    tls:
      - secretName: argo-le-tls
        hosts:
          - argo.sb-trilaksono.unique.dev
configs:
  cm:
    create: true
    url: https://argo.sb-trilaksono.unique.dev
    timeout.reconciliation: 30s
    # [ARGOCD-OIDC] Login settings (admin.enabled, oidc.config) are not set here. They come from the overlay picked by
    # argoAuth in argo-bootstrap.yaml.gotmpl: argo-auth-admin.yaml (built-in admin) or argo-auth-oidc.yaml (Entra ID).
  rbac:
      create: true
      policy.default: role:no-access
      scopes: '[roles]'
      policy.csv: |
        #################################################
        # Policy rules are in the form:
        #   p, subject, resource, action, object, effect
        # Role definitions and bindings are in the form:
        #   g, subject, inherited-subject
        #################################################

        ################### GROUPS #####################
        # Entra GitOps app (entra-app-registration v4): role claim is application_support, not legacy maintain
        # [ARGOCD-OIDC] Only matches users who log in through Entra ID (OIDC). With admin login it has no effect;
        # the built-in admin account gets role:admin from Argo CD's built-in policy.
        g, application_support, role:admin
        ################### POLICIES #####################
        # role:sync-only
        p, role:sync-only, applications, get, *, allow
        p, role:sync-only, applications, sync, *, allow
        p, role:sync-only, applications, action/apps/*/restart, *, allow
        p, role:sync-only, applications, action/batch/CronJob/create-job, *, allow
        p, role:sync-only, logs, get, chat/*, deny
        
        # role:no-access
        p, role:no-access, *, *, *, deny

        # application_support users are admins here (see entra-app-registration v4)
        # role:admin
        p, role:admin, *, *, *, allow
extraObjects: []
  