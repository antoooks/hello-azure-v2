# Image tags must match the chart version in apps/system/cert-manager.yaml (1.17.2) and be mirrored into the
# ACR (mirroring/test/io.quay.yaml). Each top-level key may appear only once: a repeated key replaces the earlier
# block entirely (this previously dropped the webhook/cainjector image overrides).
global:
  priorityClassName: system-cluster-critical
crds:
  enabled: true # replaces the deprecated installCRDs: true
image:
  repository: uqhacranto.azurecr.io/jetstack/cert-manager-controller
  tag: v1.17.2
nodeSelector:
  scalability: steady
  lifecycle: persistent
# The DNS-01 self-check asks the zone's own Azure name servers directly (no resolver caching). Azure picks the
# name server set (ns1-0X ...) per zone, so these must match this environment's zone; other zones answer REFUSED:
#   az network dns zone show -g rg-vnet-002 -n sb-trilaksono.unique.dev --query nameServers -o tsv
extraArgs:
  - --dns01-recursive-nameservers=ns1-03.azure-dns.com.:53,ns2-03.azure-dns.net.:53,ns3-03.azure-dns.org.:53,ns4-03.azure-dns.info.:53
  - --dns01-recursive-nameservers-only
resources:
  limits:
      cpu: 50m
      memory: 128Mi
  requests:
      cpu: 50m
      memory: 128Mi
webhook:
  image:
    repository: uqhacranto.azurecr.io/jetstack/cert-manager-webhook
    tag: v1.17.2
  resources:
    limits:
      cpu: 50m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 128Mi
cainjector:
  image:
    repository: uqhacranto.azurecr.io/jetstack/cert-manager-cainjector
    tag: v1.17.2
  resources:
    limits:
      cpu: 100m
      memory: 400Mi
    requests:
      cpu: 100m
      memory: 400Mi
# Pod that answers ACME HTTP-01 challenges (started by the controller on demand).
acmesolver:
  image:
    repository: uqhacranto.azurecr.io/jetstack/cert-manager-acmesolver
    tag: v1.17.2
# Post-install job that waits for the webhook.
startupapicheck:
  image:
    repository: uqhacranto.azurecr.io/jetstack/cert-manager-startupapicheck
    tag: v1.17.2
