resources:
  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: letsencrypt-azure-dns
    spec:
      acme:
        privateKeySecretRef:
          name: letsencrypt-account-key
        server: https://acme-v02.api.letsencrypt.org/directory
        solvers:
          - dns01:
              cnameStrategy: Follow
              azureDNS:
                subscriptionID: 1c01db23-b7f6-4fd8-8917-e67bd174e977 # subscription of the DNS zone: az account show --query id -o tsv
                resourceGroupName: rg-vnet-002  # this has to match the resource group of the Azure DNS zone
                hostedZoneName: sb-trilaksono.unique.dev
                environment: AzurePublicCloud
                managedIdentity:
                  # Kubelet identity client ID (has DNS Zone Contributor on the zone, day-2 25-role-assignments.tf).
                  # Changes whenever the cluster is recreated. Get it with:
                  #   az aks show -g resource-group-core -n aks-<env> --query identityProfile.kubeletidentity.clientId -o tsv
                  clientID: 8ad7101a-bec6-439e-baf3-28fe5a821ece # aks-anto kubelet identity
            selector:
              dnsZones:
                - sb-trilaksono.unique.dev